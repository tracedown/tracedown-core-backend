ktor {
    deployment {
        port = 20840
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.email.ApplicationKt.module ]
    }
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
}

email {
    provider = "console"
    provider = ${?EMAIL_PROVIDER}
    fromAddress = "notifications@tracedown.dev"
    fromAddress = ${?EMAIL_FROM_ADDRESS}
    fromName = "Tracedown"
    fromName = ${?EMAIL_FROM_NAME}

    # Dev transport: attachments are written here so they can be opened.
    # Must point at an ignored path — these are real generated documents.
    console {
        attachmentDir = "build/email-attachments"
        attachmentDir = ${?EMAIL_CONSOLE_ATTACHMENT_DIR}
    }

    smtp {
        host = ""
        host = ${?EMAIL_SMTP_HOST}
        port = "587"
        port = ${?EMAIL_SMTP_PORT}
        username = ""
        username = ${?EMAIL_SMTP_USERNAME}
        password = ""
        password = ${?EMAIL_SMTP_PASSWORD}
        tlsMode = "STARTTLS"
        tlsMode = ${?EMAIL_SMTP_TLS_MODE}
    }

    resend {
        apiKey = ""
        apiKey = ${?EMAIL_RESEND_API_KEY}
    }

    mailgun {
        apiKey = ""
        apiKey = ${?EMAIL_MAILGUN_API_KEY}
        domain = ""
        domain = ${?EMAIL_MAILGUN_DOMAIN}
        region = "us"
        region = ${?EMAIL_MAILGUN_REGION}
    }

    file {
        path = "./emails"
        path = ${?EMAIL_FILE_PATH}
    }
}

emailService {
    popTimeoutSeconds = "5"
    popTimeoutSeconds = ${?EMAIL_SERVICE_POP_TIMEOUT}

    # Optional directory of mail templates, laid out exactly like the packaged
    # `email-templates/` tree (`<group>/<name>.html`, plus `layout.html`). It is
    # consulted BEFORE the packaged templates, so a host can both add template
    # types this service does not ship and override the wording of ones it does
    # — put `system/invite.html` in there and the invite mail is yours.
    #
    # Unset (the default) means packaged templates only. A missing directory, an
    # unreadable file or a path that would escape the directory falls back to the
    # packaged template rather than failing: one bad override must not stop all
    # mail. The resolved root is logged once at startup.
    templateDir = ""
    templateDir = ${?EMAIL_TEMPLATE_DIR}

    # The chrome on every outgoing mail — templates and pre-baked bodies alike.
    # The header is the product's own (name, colours, optionally a logo the
    # recipient's client can fetch — an absolute URL to a small PNG); the footer
    # is the deployment's own small print, inserted as HTML under every message:
    # an imprint line, links to the operator's pages, how to reach them. Put that
    # markup here once, and no template needs to know the URLs.
    branding {
        logoUrl = ""
        logoUrl = ${?EMAIL_LOGO_URL}
        productUrl = ""
        productUrl = ${?EMAIL_PRODUCT_URL}
        footerHtml = ""
        footerHtml = ${?EMAIL_FOOTER_HTML}
    }
}

# Deployment environment. "production" arms the fail-fast startup guards that
# reject insecure dev defaults (all-zero AES keys, dev JWT/webhook secrets, seed
# admin, console email). Any other value (default "dev") keeps them off so the
# dev workflow stays convenient. See dev.tracedown.common.config.SecretGuard.
deployment {
    environment = "dev"
    environment = ${?DEPLOYMENT_ENV}
}
