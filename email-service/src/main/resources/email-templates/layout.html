<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>Tracedown Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0e1719; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #0e1719;">
        <tr>
            <td align="center" style="padding: 40px 16px;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%; background-color: #222729; border: 1px solid #3a4143; border-radius: 8px; overflow: hidden;">
                    <!-- The brand header: product name and colours, optionally a
                         logo, linked to the product. Resolved by the processor from
                         its branding configuration; never left as a placeholder. -->
                    {{brandHeader}}
                    <tr>
                        <td style="padding: 32px 40px;">
                            <div style="margin: 0; font-size: 15px; line-height: 1.6; color: #f2f5f4;">
                                {{content}}
                            </div>
                        </td>
                    </tr>
                    <!-- FOOTER_START: dropped entirely when the job supplies no
                         footer, so transactional mail carries no explanation of
                         why it was received. -->
                    <tr>
                        <td style="padding: 24px 40px; border-top: 1px solid #3a4143;">
                            <p style="margin: 0; font-size: 12px; color: #9eaeac;">
                                {{footer}}
                            </p>
                        </td>
                    </tr>
                    <!-- FOOTER_END -->
                    <!-- The deployment's own small print (imprint, links to the
                         operator's pages), on every message; empty when none is
                         configured. -->
                    {{brandFooter}}
                </table>
            </td>
        </tr>
    </table>
    <style>
        .var {
            font-weight: bold;
            color: #ff5e5b;
            background: #0e1719;
            padding: 1px 4px;
            border-radius: 3px;
        }
        a { color: #66a8e6; }
    </style>
</body>
</html>
