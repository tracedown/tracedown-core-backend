ktor {
    deployment {
        port = 20714
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.gateway.ApplicationKt.module ]
    }
}

# Primary PostgreSQL connection
database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}

    user = "tracedown"
    user = ${?DATABASE_USER}

    password = ""
    password = ${?DATABASE_PASSWORD}
}

# Redis A: operational (AOF-persisted) — outbox nudges, work queues, pub/sub, locks
# Redis B: ephemeral cache — metrics, rate limits, short-lived lookups
# Redis C: resource hierarchy cache — optional, disable for small deployments
redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
    c {
        url = ""
        url = ${?REDIS_C_URL}
        ttlSeconds = "3600"
        ttlSeconds = ${?REDIS_C_TTL_SECONDS}
    }
}

# Metric cache shape. Only the TTL is read here: the gateway seals a closed
# hourly bucket back into Redis B when it recomputes it from probe_results, and
# that bucket must expire on the same schedule as one the metrics-service wrote.
# Keep the value in step with the metrics-service — they read the same variable.
metrics {
    hourlyBucketTtlSeconds = "90000"
    hourlyBucketTtlSeconds = ${?METRICS_HOURLY_BUCKET_TTL_SECONDS}
}

storage {
    # Where response bodies live. The gateway only READS bodies (to serve them
    # to the dashboard) — the ingestor owns writes/relocation — but it must
    # point at the same root/bucket. With an S3-compatible store configured,
    # bodies are served as presigned redirect URLs.
    filesystemRoot = "/data/bodies"
    filesystemRoot = ${?STORAGE_FILESYSTEM_ROOT}
    s3 {
        # Same bucket/prefix the agent uploads to and the ingestor relocates in.
        endpoint = ${?STORAGE_S3_ENDPOINT}
        accessKey = ""
        accessKey = ${?STORAGE_S3_ACCESS_KEY}
        secretKey = ""
        secretKey = ${?STORAGE_S3_SECRET_KEY}
        # Signing region: "auto" for R2, the bucket's region for AWS S3; MinIO ignores it.
        region = "auto"
        region = ${?STORAGE_S3_REGION}
        # Per-call connect/read/write timeout. A store that stops answering
        # fails the call instead of parking the thread.
        timeoutSeconds = 30
        timeoutSeconds = ${?STORAGE_S3_TIMEOUT_SECONDS}
        bucket = ${?STORAGE_S3_BUCKET}
        prefix = ${?STORAGE_S3_PREFIX}
    }
}
