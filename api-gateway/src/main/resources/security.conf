# Session token signing
jwt {
    secret = "default-dev-secret-change-in-production"
    secret = ${?JWT_SECRET}

    ttlMinutes = 43200
    ttlMinutes = ${?JWT_TTL_MINUTES}
}

# Authentication and password rules
auth {
    passwordPolicy {
        # Controls the minimum password length, out of which
        # at least minUppercase, minDigits and minSpecial
        # must be corresponding characters.
        minLength = 8
        minLength = ${?PASSWORD_MIN_LENGTH}

        minUppercase = 1
        minUppercase = ${?PASSWORD_MIN_UPPERCASE}

        minDigits = 1
        minDigits = ${?PASSWORD_MIN_DIGITS}

        minSpecial = 1
        minSpecial = ${?PASSWORD_MIN_SPECIAL}
    }

    # TOTP issuer name shown in authenticator apps
    totpIssuer = "Tracedown"
    totpIssuer = ${?TOTP_ISSUER}
}

# Browser origins allowed to call this API.
#
# Unset (the default) emits no CORS headers at all. The app and the API are
# served from one origin in the bundled stack, so no request from the dashboard
# is cross-origin and no CORS header answers anything — and silence is the safe
# reading: nothing gains credentialed access because a variable was forgotten.
#
# Set this only when the dashboard is served from a different origin than the
# API. The dashboard sends credentials (cookies + Authorization), so the
# response must name an exact origin — a wildcard is not usable with
# credentials — which is why the origins are listed rather than inferred.
#
# Comma-separated, each entry exactly scheme://host[:port] with no trailing
# slash, path or query (e.g. "https://app.example.com,https://ops.example.com").
# Anything else is refused at startup rather than silently registering a host
# nobody meant.
cors {
    origins = ""
    origins = ${?API_CORS_ORIGINS}
}

# Largest request body the API will accept, in bytes. Field-level limits run
# after a body has been received and deserialized, so they bound what is stored,
# not what can be sent. The largest legitimate body is a probe script (64 KB)
# inside a service payload; 1 MiB leaves generous room above that and matches
# the default the bundled nginx enforces, so a deployment without nginx in
# front behaves the same as one with it.
requestBody {
    maxBytes = 1048576
    maxBytes = ${?MAX_REQUEST_BODY_BYTES}
}

# Per-IP rate limiting (Redis B backed, sliding window)
rateLimit {
    enabled = true
    enabled = ${?RATE_LIMIT_ENABLED}

    # Number of trusted reverse proxies in front of the gateway. The client IP
    # used for rate-limit keys is taken this many hops back from the TCP peer,
    # so a client-supplied X-Forwarded-For cannot spoof the key. Set to the
    # actual count of proxies between the internet and the gateway (bundled
    # nginx = 1; add one per extra edge/CDN hop). 0 ignores XFF entirely.
    #
    # Getting this too low is silent by construction: every request then keys on
    # a proxy's address, the whole platform shares one bucket, and the 16th login
    # in a minute from anyone 429s everybody. The gateway therefore watches the
    # forwarded chains it actually receives and warns when they say the hop count
    # is wrong — see ProxyChainObserver — and warns at startup if this is left at
    # its default in production.
    trustedProxies = 1
    trustedProxies = ${?TRUSTED_PROXIES}

    # Endpoints that are unauthenticated by design (agent enrolment and
    # certificate renewal) are metered on their own budget: each request costs a
    # bcrypt verification and an RSA signature, and they are published straight
    # to the internet. Sized so a fleet coming up at once — or one agent
    # retrying hard — cannot lock itself out, while a stranger cannot spend the
    # gateway's CPU for free.
    internal {
        maxRequests = 60
        maxRequests = ${?RATE_LIMIT_INTERNAL_MAX}

        windowSeconds = 60
        windowSeconds = ${?RATE_LIMIT_INTERNAL_WINDOW}
    }

    general {
        maxRequests = 120
        maxRequests = ${?RATE_LIMIT_GENERAL_MAX}

        windowSeconds = 60
        windowSeconds = ${?RATE_LIMIT_GENERAL_WINDOW}
    }
    auth {
        maxRequests = 15
        maxRequests = ${?RATE_LIMIT_AUTH_MAX}

        windowSeconds = 60
        windowSeconds = ${?RATE_LIMIT_AUTH_WINDOW}
    }
}
