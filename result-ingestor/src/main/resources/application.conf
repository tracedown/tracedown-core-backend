ktor {
    deployment {
        port = 20820
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.ingestor.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}
    user = "tracedown"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
}

storage {
    # Shared filesystem volume where the probe agent writes response bodies.
    # The ingestor relocates each body into a server-derived, tenant-scoped key
    # under this root, so it must match the agent's PROBE_AGENT_STORAGE_DIR and
    # be mounted read-write here.
    filesystemRoot = "/data/bodies"
    filesystemRoot = ${?STORAGE_FILESYSTEM_ROOT}
    s3 {
        # Set to relocate bodies within an S3-compatible store instead of the
        # filesystem. Must be the same bucket/prefix the agent uploads to.
        endpoint = ${?STORAGE_S3_ENDPOINT}
        accessKey = ""
        accessKey = ${?STORAGE_S3_ACCESS_KEY}
        secretKey = ""
        secretKey = ${?STORAGE_S3_SECRET_KEY}
        # Signing region: "auto" for R2, the bucket's region for AWS S3, whatever the
        # store is configured to sign for otherwise (many ignore it entirely).
        region = "auto"
        region = ${?STORAGE_S3_REGION}
        # Per-call connect/read/write timeout. A store that stops answering
        # fails the call instead of parking the thread.
        timeoutSeconds = 30
        timeoutSeconds = ${?STORAGE_S3_TIMEOUT_SECONDS}
        bucket = ${?STORAGE_S3_BUCKET}
        prefix = ${?STORAGE_S3_PREFIX}
    }
    stores {
        # Directories a filesystem body store's root must lie inside
        # (comma-separated). A store's root is a directory mounted into both the
        # gateway and the ingestor at the same path. Unset (the default) means
        # filesystem body stores are not available at all — which directory this
        # process may read bodies out of is the operator's decision, never a
        # default.
        filesystemBases = ${?BODY_STORE_FILESYSTEM_BASES}

        # The key a body store's credentials are encrypted with — must match the
        # gateway's. Needed only to import bodies from an agent's own S3 body
        # store. Not the platform key: this service decrypts nothing else.
        aesKey = ${?BODY_STORE_AES_KEY}

        # Allow a store endpoint over http, or on a private / internal host —
        # for an object store on the same private network as the platform. Off
        # by default, and must match the gateway's.
        privateEndpoints = "false"
        privateEndpoints = ${?BODY_STORE_PRIVATE_ENDPOINTS}
    }
}

# Deployment environment. "production" arms the fail-fast startup guards that
# reject insecure dev defaults across the fleet. Here that is
# STORAGE_S3_SECRET_KEY, guarded only when the S3 endpoint above turns S3 body
# storage on. Whatever the value, this service reports the environment it
# resolved at startup, so a missing or misspelt DEPLOYMENT_ENV shows up here as
# well as on the services the guards protect.
# See dev.tracedown.common.config.SecretGuard.
deployment {
    environment = "dev"
    environment = ${?DEPLOYMENT_ENV}
}
