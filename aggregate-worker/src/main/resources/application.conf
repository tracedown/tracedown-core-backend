ktor {
    deployment {
        port = 20860
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.worker.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}
    user = "tracedown"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
}

storage {
    # Where platform storage lives — the same root/bucket/prefix the ingestor
    # relocates bodies into. Retention and purge only delete bodies inside it;
    # a stored URI outside it is skipped.
    #
    # Deliberately without a default: an unset root (or bucket) means this worker
    # was not told where platform storage is, and it then deletes exactly as it
    # did before confinement existed rather than purging rows and orphaning the
    # objects behind them. It says so at startup — set these to the same values
    # the result-ingestor uses.
    filesystemRoot = ${?STORAGE_FILESYSTEM_ROOT}
    s3 {
        # Uncomment to enable S3-compatible body storage deletion.
        # Works with any S3-compatible store (R2, SeaweedFS, Garage, Ceph RGW, etc.)
        # endpoint = "https://account.r2.cloudflarestorage.com"
        endpoint = ${?STORAGE_S3_ENDPOINT}
        accessKey = ""
        accessKey = ${?STORAGE_S3_ACCESS_KEY}
        secretKey = ""
        secretKey = ${?STORAGE_S3_SECRET_KEY}
        # Signing region: "auto" for R2, the bucket's region for AWS S3, whatever the
        # store is configured to sign for otherwise (many ignore it entirely).
        region = "auto"
        region = ${?STORAGE_S3_REGION}
        # Per-call connect/read/write timeout. A store that stops answering
        # fails the call instead of parking the thread.
        timeoutSeconds = 30
        timeoutSeconds = ${?STORAGE_S3_TIMEOUT_SECONDS}
        bucket = ${?STORAGE_S3_BUCKET}
        prefix = ${?STORAGE_S3_PREFIX}
    }
}

worker {
    resultRetentionDays = 90
    resultRetentionDays = ${?RESULT_RETENTION_DAYS}
    # How long stored response bodies are kept, separately from the results they
    # belong to. 90 is the same as the result window, so an upgrade changes
    # nothing; lower it to shed bodies while keeping the result history, and set
    # it to -1 to never expire a body by age. A body is reachable only through
    # its probe_steps row, so it never outlives its result either way — with both
    # windows set the effective body lifetime is the smaller of the two.
    bodyRetentionDays = 90
    bodyRetentionDays = ${?BODY_RETENTION_DAYS}
    hourlyAggregateRetentionDays = 365
    hourlyAggregateRetentionDays = ${?HOURLY_AGGREGATE_RETENTION_DAYS}
    agentHealthRetentionDays = 90
    agentHealthRetentionDays = ${?AGENT_HEALTH_RETENTION_DAYS}
    # Same variable the api-gateway reads — one setting governs the audit window.
    auditLogRetentionDays = 90
    auditLogRetentionDays = ${?AUDIT_LOG_RETENTION_DAYS}
    notificationLogRetentionDays = 90
    notificationLogRetentionDays = ${?NOTIFICATION_LOG_RETENTION_DAYS}
    trustedDomainMode = false
    trustedDomainMode = ${?TRUSTED_DOMAIN_MODE}
    # How long an outbox consumer may sit behind the log without advancing its
    # cursor before the purge stops holding rows back for it. Without this an
    # unreachable consumer pins the outbox — a row per probe result — until the
    # database runs out of disk. Set to 0 to honour every cursor unconditionally.
    outboxCursorStaleHours = 24
    outboxCursorStaleHours = ${?OUTBOX_CURSOR_STALE_HOURS}

    intervals {
        hourlyAggregation = 900
        hourlyAggregation = ${?WORKER_INTERVAL_HOURLY_AGGREGATION}
        dailyAggregation = 3600
        dailyAggregation = ${?WORKER_INTERVAL_DAILY_AGGREGATION}
        retention = 3600
        retention = ${?WORKER_INTERVAL_RETENTION}
        purge = 300
        purge = ${?WORKER_INTERVAL_PURGE}
        sessionCleanup = 900
        sessionCleanup = ${?WORKER_INTERVAL_SESSION_CLEANUP}
    }
}

# Deployment environment. "production" arms the fail-fast startup guards that
# reject insecure dev defaults across the fleet. This service has no such
# defaults of its own, but it reports the value it resolved at startup, so a
# missing or misspelt DEPLOYMENT_ENV shows up here as well as on the services
# the guards protect. See dev.tracedown.common.config.SecretGuard.
deployment {
    environment = "dev"
    environment = ${?DEPLOYMENT_ENV}
}
