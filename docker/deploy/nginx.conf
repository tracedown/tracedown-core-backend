# Tracedown host nginx config — serves the frontend bundle and proxies the
# backend. Drop into /etc/nginx/sites-available/ (or conf.d/), adjust
# server_name and root, then reload nginx.
#
# HTTP-ONLY ON PURPOSE. TLS termination is yours: once this vhost works over
# plain HTTP, run `certbot --nginx` (Let's Encrypt) or install your internal
# certificates and add the ssl listener. Do not put this on the open internet
# without TLS — sessions and probe credentials travel through it.
#
# Only the frontend and the backend's public endpoints are exposed here; every
# other service talks on the internal docker network and publishes nothing.

server {
    listen 80;
    server_name tracedown.example.com;

    # The frontend bundle — the deploy stack unpacks it to
    # <deploy dir>/frontend-dist; point root at that path (or copy the files
    # to a conventional web root).
    root /opt/tracedown/deploy/frontend-dist;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable fingerprinted assets can cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # REST API → api-gateway.
    location /api/ {
        proxy_pass http://127.0.0.1:20714/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway health endpoint.
    location /ping {
        proxy_pass http://127.0.0.1:20714/ping;
    }

    # Probe-agent enrolment and health challenges → api-gateway.
    #
    # These live at the gateway root, not under /api/, so without these rules
    # they fall through to the SPA catch-all above and an agent pointed at the
    # https gateway URL is answered with index.html. Remote agents cannot
    # enrol at all without them (and the agent refuses to send its bootstrap
    # token over plain http in production, so there is no fallback).
    #
    # Listed one path at a time on purpose — do NOT replace these with a
    # `location /internal/` catch-all. Everything else under that prefix is
    # for the internal docker network, and a future addition there would be
    # published to the internet by an over-broad rule rather than by a
    # deliberate decision here.
    #
    # Why these three are safe to publish:
    #  - /internal/agents/register carries a single-use bootstrap token an
    #    operator issued; it is an enrolment endpoint and being reachable is
    #    the whole point of it.
    #  - /internal/agents/renew is gated on proof-of-possession of the agent's
    #    existing private key, not on a token.
    #  - /internal/health/token/{challengeId} returns a 32-byte random token
    #    with a 30-second TTL, under an unguessable challenge id the scheduler
    #    minted and handed to one named agent over mTLS. The token only means
    #    anything to the scheduler that issued it, which compares it against
    #    that one agent's challenge.
    location = /internal/agents/register {
        proxy_pass http://127.0.0.1:20714;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /internal/agents/renew {
        proxy_pass http://127.0.0.1:20714;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ^~ so this prefix wins over the SPA fallback without regex locations
    # getting a look in. The trailing path segment is the challenge id.
    location ^~ /internal/health/token/ {
        proxy_pass http://127.0.0.1:20714;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus scrape endpoint → metrics-service.
    location /metrics/ {
        proxy_pass http://127.0.0.1:20850/metrics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket → realtime-service. The long read timeout keeps idle
    # dashboard connections alive. Avoid logging the query string here — a
    # legacy ?token= auth fallback must never land in access logs.
    location /ws {
        access_log off;
        proxy_pass http://127.0.0.1:20870;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
