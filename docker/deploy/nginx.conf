# Tracedown host nginx config — serves the frontend bundle and proxies the
# backend. Drop into /etc/nginx/sites-available/ (or conf.d/), adjust
# server_name and root, then reload nginx.
#
# HTTP-ONLY ON PURPOSE. TLS termination is yours: once this vhost works over
# plain HTTP, run `certbot --nginx` (Let's Encrypt) or install your internal
# certificates and add the ssl listener. Do not put this on the open internet
# without TLS — sessions and probe credentials travel through it.
#
# Only the frontend and the backend's public endpoints are exposed here; every
# other service talks on the internal docker network and publishes nothing.

server {
    listen 80;
    server_name tracedown.example.com;

    # The frontend bundle — the deploy stack unpacks it to
    # <deploy dir>/frontend-dist; point root at that path (or copy the files
    # to a conventional web root).
    root /opt/tracedown/deploy/frontend-dist;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable fingerprinted assets can cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # REST API → api-gateway.
    location /api/ {
        proxy_pass http://127.0.0.1:20714/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway health endpoint.
    location /ping {
        proxy_pass http://127.0.0.1:20714/ping;
    }

    # Prometheus scrape endpoint → metrics-service.
    location /metrics/ {
        proxy_pass http://127.0.0.1:20850/metrics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket → realtime-service. The long read timeout keeps idle
    # dashboard connections alive. Avoid logging the query string here — a
    # legacy ?token= auth fallback must never land in access logs.
    location /ws {
        access_log off;
        proxy_pass http://127.0.0.1:20870;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
