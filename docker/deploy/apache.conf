# Tracedown host Apache config — serves the frontend bundle and proxies the
# backend. Requires: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite
# (a2enmod proxy proxy_http proxy_wstunnel rewrite headers).
#
# HTTP-ONLY ON PURPOSE. TLS termination is yours: once this vhost works over
# plain HTTP, run `certbot --apache` (Let's Encrypt) or install your internal
# certificates and add the :443 vhost. Do not put this on the open internet
# without TLS — sessions and probe credentials travel through it.
#
# Only the frontend and the backend's public endpoints are exposed here; every
# other service talks on the internal docker network and publishes nothing.

<VirtualHost *:80>
    ServerName tracedown.example.com

    # The frontend bundle — the deploy stack unpacks it to
    # <deploy dir>/frontend-dist; point DocumentRoot at that path.
    DocumentRoot /opt/tracedown/deploy/frontend-dist

    <Directory /opt/tracedown/deploy/frontend-dist>
        Require all granted
        Options -Indexes
        AllowOverride None

        # SPA fallback: client-side routes resolve to index.html.
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Immutable fingerprinted assets can cache forever.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ProxyPreserveHost On

    # WebSocket → realtime-service (must come before the plain proxies).
    # Avoid logging the query string here — a legacy ?token= auth fallback
    # must never land in access logs.
    ProxyPass        /ws ws://127.0.0.1:20870/ws
    ProxyPassReverse /ws ws://127.0.0.1:20870/ws

    # REST API + health → api-gateway.
    ProxyPass        /api/ http://127.0.0.1:20714/api/
    ProxyPassReverse /api/ http://127.0.0.1:20714/api/
    ProxyPass        /ping http://127.0.0.1:20714/ping
    ProxyPassReverse /ping http://127.0.0.1:20714/ping

    # Prometheus scrape endpoint → metrics-service.
    ProxyPass        /metrics/ http://127.0.0.1:20850/metrics/
    ProxyPassReverse /metrics/ http://127.0.0.1:20850/metrics/
</VirtualHost>
