ktor {
    deployment {
        port = 20870
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.realtime.ApplicationKt.module ]
    }
}

database {
    url = ${DATABASE_URL}
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
}

redis {
    a {
        url = ${REDIS_A_URL}
    }
}

realtime {
    pingIntervalMs = 5000
    pingTimeoutMs = 10000
}

# Deployment environment. "production" arms the fail-fast startup guards that
# reject insecure dev defaults across the fleet. This service has no such
# defaults of its own, but it reports the value it resolved at startup, so a
# missing or misspelt DEPLOYMENT_ENV shows up here as well as on the services
# the guards protect. See dev.tracedown.common.config.SecretGuard.
deployment {
    environment = "dev"
    environment = ${?DEPLOYMENT_ENV}
}
