name: Release

# Version-bump-driven and CI-gated: runs after the CI workflow succeeds on a
# main push, and publishes only when the version in build.gradle.kts has no
# release yet.
# Merging a PR that bumps the version IS the release trigger — the workflow
# creates the vX.Y.Z tag and the GitHub release itself.
#
# Artifacts: every runnable service as a self-contained jar, plus the
# schema-migrator as a distZip (Flyway 11 cannot scan migrations inside a
# merged jar, so the migrator ships as a distribution and runs from its bin/
# launcher). Tests are covered by the CI workflow on the same push.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # Upstream-only: forks never release.
    # Runs only after the CI run for this main push succeeded — a release
    # can never ship from an untested commit.
    if: >-
      github.repository == 'tracedown/tracedown-core-backend' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^\s*version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Package service jars and migrator dist
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew fatJar :schema-migrator:distZip

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Tracedown Core Backend ${{ steps.version.outputs.tag }}" \
            --notes "Each service is a self-contained jar (\`java -jar\`). The schema-migrator ships as a zip — unpack and run \`bin/schema-migrator\` (it must not be merged into a fat jar; Flyway would find no migrations). See the deploy compose in \`docker/deploy/\` for running the whole stack from these artifacts." \
            */build/libs/*-all.jar \
            schema-migrator/build/distributions/schema-migrator-*.zip
