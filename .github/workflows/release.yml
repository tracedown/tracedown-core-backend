name: Release

# Version-bump-driven, like the rest of the stack: runs on every push to main
# and publishes only when the version in build.gradle.kts has no release yet.
# Merging a PR that bumps the version IS the release trigger — the workflow
# creates the vX.Y.Z tag and the GitHub release itself. main is PR-protected,
# so every commit here already passed the PR checks; nothing is re-tested.
#
# Artifacts: every runnable service as a self-contained jar, the monolith
# (whole platform in one jar, latest frontend release baked in, embedded Lace
# executor), plus the schema-migrator as a distZip (Flyway 11 cannot scan
# migrations inside a merged jar, so the migrator ships as a distribution and
# runs from its bin/ launcher).

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # Upstream-only: forks never release.
    if: github.repository == 'tracedown/tracedown-core-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^\s*version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Package service jars and migrator dist
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew fatJar :schema-migrator:distZip -PmonolithFrontend=latest

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Tracedown Core Backend ${{ steps.version.outputs.tag }}" \
            --notes "Each service is a self-contained jar (\`java -jar\`). \`tracedown-monolith\` is the whole platform in one jar — every service in one JVM, the dashboard served from the gateway port, probes executed in-process (no agents needed); it only needs Postgres and Redis. The schema-migrator ships as a zip — unpack and run \`bin/schema-migrator\` (it must not be merged into a fat jar; Flyway would find no migrations; the monolith migrates on boot by itself). See the deploy compose in \`docker/deploy/\` for running the per-service stack from these artifacts." \
            */build/libs/*-all.jar \
            schema-migrator/build/distributions/schema-migrator-*.zip
