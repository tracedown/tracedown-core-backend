ktor {
    deployment {
        port = 20850
        port = ${?PORT}
    }
    application {
        modules = [ dev.tracedown.metrics.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/tracedown"
    url = ${?DATABASE_URL}
    user = "tracedown"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

redis {
    a {
        url = "redis://localhost:6379"
        url = ${?REDIS_A_URL}
    }
    b {
        url = "redis://localhost:6380"
        url = ${?REDIS_B_URL}
    }
}

metrics {
    metricsTtlSeconds = "86400"
    metricsTtlSeconds = ${?METRICS_TTL_SECONDS}

    hourlyBucketTtlSeconds = "90000"
    hourlyBucketTtlSeconds = ${?METRICS_HOURLY_BUCKET_TTL_SECONDS}
}

# Deployment environment. "production" arms the fail-fast startup guards that
# reject insecure dev defaults across the fleet. This service has no such
# defaults of its own, but it reports the value it resolved at startup, so a
# missing or misspelt DEPLOYMENT_ENV shows up here as well as on the services
# the guards protect. See dev.tracedown.common.config.SecretGuard.
deployment {
    environment = "dev"
    environment = ${?DEPLOYMENT_ENV}
}
